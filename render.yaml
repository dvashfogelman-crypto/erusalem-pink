databases:
  - name: pink-kits-db
    plan: free
    databaseName: pinkkits
    user: pinkkits

services:
  - type: web
    name: jerusalem-pink
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pink-kits-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
